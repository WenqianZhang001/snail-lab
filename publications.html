<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publications — SNAIL Lab</title>
<meta name="description" content="Publications from the SNAIL Lab at Yale University on RF perception, multi-modal sensing, robotics, and extended reality.">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Source+Serif+4:opsz,wght@8..60,400..600&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<script>
  try { var t = localStorage.getItem("snail-theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
</head>
<body data-page="publications">

<header id="site-header"></header>

<main id="main">

  <section class="page-head">
    <div class="container">
      <span class="eyebrow">Publications</span>
      <h1>Papers</h1>
      <p class="lead">
        Filter by topic or search by title, author, and venue. For the complete and always-current list, see
        the PI's <a href="https://scholar.google.com/citations?user=cHbx6vAAAAAJ" rel="noopener" target="_blank">Google Scholar profile</a>.
      </p>
    </div>
  </section>

  <section class="section">
    <div class="container">

      <div class="pub-controls">
        <div class="search-field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="search" id="pub-search" placeholder="Search title, author, or venue" aria-label="Search publications">
        </div>
        <div class="filter-chips" id="pub-filters" role="group" aria-label="Filter publications by topic"></div>
      </div>

      <p class="text-muted pub-count" id="pub-count" aria-live="polite"></p>

      <div id="publications"></div>

    </div>
  </section>

</main>

<footer id="site-footer"></footer>

<script src="data/site.js"></script>
<script src="data/research.js"></script>
<script src="data/projects.js"></script>
<script src="data/publications.js"></script>
<script src="data/people.js"></script>
<script src="data/news.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
